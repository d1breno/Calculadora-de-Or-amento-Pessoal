<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Orçamento Pessoal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Calculadora de Orçamento</h1>
  </header>
  <main>
    <section id="budget-form">
      <h2>Adicionar Transação</h2>
      <form id="transaction-form">
        <input type="text" id="description" placeholder="Descrição" required>
        <input type="number" id="amount" placeholder="Valor (ex: 50 ou -20)" required>
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section id="budget-summary">
      <h2>Resumo do Orçamento</h2>
      <div id="summary">
        <p>Renda: <span id="income">R$ 0,00</span></p>
        <p>Despesas: <span id="expenses">R$ 0,00</span></p>
        <p>Saldo: <span id="balance">R$ 0,00</span></p>
      </div>
    </section>

    <section id="transaction-list">
      <h2>Transações</h2>
      <ul id="transactions"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Calculadora de Orçamento</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
